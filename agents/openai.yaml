interface:
  display_name: "Driftlock"
  short_description: "Detect documentation drift, route current context, and preserve unresolved feedback."
  default_prompt: "Use $driftlock to find this project's current documentation branch, check freshness, identify the authoritative task and unresolved-problem intake when relevant, and report the minimum required updates without reading archives by default."

policy:
  allow_implicit_invocation: true
