name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python tests/run_ci.py
      - name: Validate skill package
        run: python -c "import pathlib; p=pathlib.Path('SKILL.md'); assert p.is_file() and p.read_text(encoding='utf-8').startswith('---')"
      - name: Run end-to-end demo
        run: python examples/run_demo.py
