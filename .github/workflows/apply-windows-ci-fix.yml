name: apply-windows-ci-fix

on:
  push:
    branches:
      - fix/windows-ci-cross-platform
    paths:
      - .github/workflows/apply-windows-ci-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-ci-cross-platform
          fetch-depth: 0
      - name: Patch implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/project_docs.py")
          text = path.read_text(encoding="utf-8")

          old = """            doc = Document(path, rel, meta, raw)\n            self.document_list.append(doc)\n"""
          new = """            doc = Document(path, rel, meta, raw)\n            doc.content_sha256 = self._file_sha256(path, raw)\n            self.document_list.append(doc)\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    def _validate_relpath(self, value):\n        if (\n            not isinstance(value, str)\n            or not value\n            or \"\\\\\" in value\n            or re.match(r\"^[A-Za-z]:\", value)\n            or Path(value).is_absolute()\n            or PurePosixPath(value).is_absolute()\n            or \"..\" in PurePosixPath(value).parts\n        ):\n            return False\n        try:\n            target = (self.root / value).resolve()\n            target.relative_to(self.root)\n        except (OSError, ValueError):\n            return False\n        return True\n"""
          new = """    def _file_sha256(self, path, data=None):\n        \"\"\"Hash content using the repository's explicit LF policy when declared.\n\n        A freshly created Windows worktree file may still contain CRLF even\n        though Git has staged canonical LF bytes. When .gitattributes declares\n        ``eol=lf``, hash the LF-equivalent bytes so verified locks remain stable\n        across clones. Files without that explicit policy keep raw-byte hashes.\n        \"\"\"\n        path = Path(path)\n        if data is None:\n            data = path.read_bytes()\n        rel = rel_posix(path, self.root)\n        if self.git_root:\n            attr = run_git(self.root, \"check-attr\", \"-z\", \"eol\", \"--\", rel)\n            fields = attr.stdout.split(\"\\0\") if attr.returncode == 0 else []\n            if len(fields) >= 3 and fields[1] == \"eol\" and fields[2] == \"lf\":\n                data = data.replace(b\"\\r\\n\", b\"\\n\")\n        return sha256_bytes(data)\n\n    def _validate_relpath(self, value):\n        if (\n            not isinstance(value, str)\n            or not value\n            or \"\\\\\" in value\n            or re.match(r\"^[A-Za-z]:\", value)\n            or Path(value).is_absolute()\n            or PurePosixPath(value).is_absolute()\n            or \"..\" in PurePosixPath(value).parts\n        ):\n            return False\n\n        # Glob patterns are syntax, not concrete filesystem paths. Resolve only\n        # their literal prefix; concrete matches are containment-checked again\n        # in _resolved_pattern before any matched file is read.\n        static_parts = []\n        for part in PurePosixPath(value).parts:\n            if any(char in part for char in \"*?[\"):\n                break\n            static_parts.append(part)\n        try:\n            target = self.root.joinpath(*static_parts).resolve()\n            target.relative_to(self.root)\n        except (OSError, ValueError):\n            return False\n        return True\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """            values.append({\"path\": rel_posix(resolved, self.root), \"sha256\": sha256_bytes(resolved.read_bytes())})\n"""
          new = """            values.append({\"path\": rel_posix(resolved, self.root), \"sha256\": self._file_sha256(resolved)})\n"""
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git config user.name "KairosSignal CI Fix"
          git config user.email "noreply@kairossignal.com"
          git add scripts/project_docs.py
          git commit -m "fix: stabilize Windows path and hash handling"
          git push origin HEAD:fix/windows-ci-cross-platform
