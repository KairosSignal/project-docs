name: guard-owner-hardening

on:
  push:
    branches: [security/filesystem-hardening]
    paths:
      - scripts/_guard_owner_patch.py
      - .github/workflows/guard-owner-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/filesystem-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guard ownership patch
        run: python scripts/_guard_owner_patch.py
      - name: Run full tests
        run: python tests/run_ci.py
      - name: Validate skill package
        run: python -c "import pathlib; p=pathlib.Path('SKILL.md'); assert p.is_file() and p.read_text(encoding='utf-8').startswith('---')"
      - name: Run end-to-end demo
        run: python examples/run_demo.py
      - name: Commit hardened implementation
        shell: bash
        run: |
          git config user.name "KairosSignal Security Fix"
          git config user.email "noreply@kairossignal.com"
          git add scripts/project_docs.py tests/test_project_docs.py
          git commit -m "fix: make guard recovery ownership-safe and bump v0.1.1"
          git push origin HEAD:security/filesystem-hardening
